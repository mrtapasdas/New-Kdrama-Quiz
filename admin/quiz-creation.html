<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz Creation | Admin | NEW K-DRAMA Quiz</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0a0a0a">
<link rel="icon" href="../images/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div id="adminGate" class="admin-gate">Checking access...</div>
<div class="admin-body">
  <aside class="admin-sidebar" id="adminSidebar">
    <a href="index.html" class="logo"><img src="../images/logo.png" alt="NEW K-DRAMA"></a>
    <nav class="admin-nav">
      <a href="index.html">📊 Dashboard</a>
      <a href="analytics.html">📈 Analytics</a>
      <a href="quiz-creation.html" class="active">📝 Quiz Creation</a>
      <a href="users.html">👥 Users</a>
      <a href="../index.html">🏠 View Site</a>
      <a href="#" id="adminLogout">🚪 Log Out</a>
    </nav>
  </aside>

  <main class="admin-main">
    <div class="admin-topbar">
      <button class="btn btn-outline btn-sm mobile-admin-toggle" id="sidebarToggle">☰ Menu</button>
      <h1>Quiz Creation</h1>
      <button class="btn btn-primary btn-sm" id="newQuizBtn">+ New Quiz</button>
    </div>

    <div class="admin-card" id="editorCard" style="display:none">
      <h3 id="editorTitle">Create Quiz</h3>
      <input type="hidden" id="editQuizId">
      <div class="form-group"><label>Quiz Title</label><input type="text" id="qTitle" required></div>
      <div class="form-group"><label>Category</label><input type="text" id="qCategory" placeholder="e.g. Romance, Thriller, Fantasy" required></div>
      <div class="form-group"><label>Difficulty</label>
        <select id="qDifficulty" style="width:100%;padding:12px;border:1.5px solid var(--border);border-radius:10px;background:var(--bg);color:var(--text)">
          <option>Easy</option><option selected>Medium</option><option>Hard</option>
        </select>
      </div>
      <div class="form-group"><label>Thumbnail Image URL</label><input type="url" id="qThumb" placeholder="https://..."></div>
      <div class="form-group"><label>Description</label><input type="text" id="qDesc" required></div>
      <div class="form-group"><label>Time per Question (seconds)</label><input type="number" id="qTime" value="20" min="5" max="120" required></div>

      <h3 style="margin-top:24px">Questions</h3>
      <div id="questionsWrap"></div>
      <button type="button" class="btn btn-outline btn-sm" id="addQuestionBtn">+ Add Question</button>

      <div style="margin-top:24px;display:flex;gap:12px;flex-wrap:wrap">
        <button class="btn btn-primary" id="saveQuizBtn">Save Quiz</button>
        <button class="btn btn-ghost" id="cancelEditBtn">Cancel</button>
      </div>
    </div>

    <div class="admin-card">
      <h3>All Quizzes</h3>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Title</th><th>Category</th><th>Questions</th><th>Difficulty</th><th>Actions</th></tr></thead>
          <tbody id="quizListBody">
            <tr><td colspan="5" style="text-align:center;color:var(--text-light)">Loading quizzes...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<div class="toast" id="toast"></div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="../js/firebase-config.js"></script>
<script src="../js/db.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/admin.js"></script>

<script>
document.addEventListener('DOMContentLoaded', async ()=>{
  const session = await requireAdmin();
  if(!session) return;
  initAdminChrome(session);

  await renderQuizList();

  document.getElementById('newQuizBtn').addEventListener('click', ()=>openEditor());
  document.getElementById('cancelEditBtn').addEventListener('click', closeEditor);
  document.getElementById('addQuestionBtn').addEventListener('click', ()=>addQuestionBlock());
  document.getElementById('saveQuizBtn').addEventListener('click', saveQuiz);
});

async function renderQuizList(){
  const body = document.getElementById('quizListBody');
  try{
    const quizzes = await DB.getQuizzes();
    window.__ALL_QUIZZES__ = quizzes; // cache for edit lookups
    body.innerHTML = quizzes.length ? quizzes.map(q=>`
      <tr>
        <td>${q.title}</td>
        <td>${q.category}</td>
        <td>${q.questions.length}</td>
        <td>${q.difficulty}</td>
        <td>
          <button class="btn btn-outline btn-sm" onclick="editQuiz('${q.id}')">Edit</button>
          <button class="btn btn-danger btn-sm" onclick="deleteQuiz('${q.id}')">Delete</button>
        </td>
      </tr>`).join('') : `<tr><td colspan="5" style="text-align:center;color:var(--text-light)">No quizzes yet — create one!</td></tr>`;
  }catch(err){
    console.error('Failed to load quizzes:', err);
    body.innerHTML = `<tr><td colspan="5" style="text-align:center;color:var(--danger)">Failed to load quizzes.</td></tr>`;
  }
}

function openEditor(quiz=null){
  document.getElementById('editorCard').style.display = 'block';
  document.getElementById('editorTitle').textContent = quiz ? 'Edit Quiz' : 'Create Quiz';
  document.getElementById('editQuizId').value = quiz ? quiz.id : '';
  document.getElementById('qTitle').value = quiz ? quiz.title : '';
  document.getElementById('qCategory').value = quiz ? quiz.category : '';
  document.getElementById('qDifficulty').value = quiz ? quiz.difficulty : 'Medium';
  document.getElementById('qThumb').value = quiz ? quiz.thumbnail : '';
  document.getElementById('qDesc').value = quiz ? quiz.description : '';
  document.getElementById('qTime').value = quiz ? quiz.timePerQuestion : 20;

  document.getElementById('questionsWrap').innerHTML = '';
  if(quiz && quiz.questions.length){
    quiz.questions.forEach(q=>addQuestionBlock(q));
  } else {
    addQuestionBlock();
  }
  document.getElementById('editorCard').scrollIntoView({behavior:'smooth'});
}

function closeEditor(){
  document.getElementById('editorCard').style.display = 'none';
}

function addQuestionBlock(data=null){
  const wrap = document.getElementById('questionsWrap');
  const idx = wrap.children.length;
  const block = document.createElement('div');
  block.className = 'question-block';
  block.innerHTML = `
    <button type="button" class="remove-q" onclick="this.parentElement.remove()">✕ Remove</button>
    <div class="form-group"><label>Question ${idx+1}</label><input type="text" class="q-text" value="${data?escapeHtml(data.q):''}" required></div>
    ${[0,1,2,3].map(i=>`
      <div class="opt-row">
        <input type="radio" name="correct-${Date.now()}-${idx}" class="q-correct" ${data && data.answer===i ? 'checked':''}>
        <input type="text" class="q-opt" placeholder="Option ${i+1}" value="${data?escapeHtml(data.options[i]||''):''}" required>
      </div>`).join('')}
  `;
  wrap.appendChild(block);
}

function escapeHtml(str){
  const d = document.createElement('div'); d.textContent = str; return d.innerHTML;
}

async function saveQuiz(){
  const title = document.getElementById('qTitle').value.trim();
  const category = document.getElementById('qCategory').value.trim();
  const difficulty = document.getElementById('qDifficulty').value;
  const thumbnail = document.getElementById('qThumb').value.trim() || `https://picsum.photos/seed/${encodeURIComponent(title)}/400/250`;
  const description = document.getElementById('qDesc').value.trim();
  const timePerQuestion = parseInt(document.getElementById('qTime').value) || 20;

  const questionBlocks = document.querySelectorAll('.question-block');
  const questions = [];
  let valid = true;

  questionBlocks.forEach(block=>{
    const qText = block.querySelector('.q-text').value.trim();
    const opts = Array.from(block.querySelectorAll('.q-opt')).map(i=>i.value.trim());
    const correctRadio = block.querySelector('.q-correct:checked');
    if(!qText || opts.some(o=>!o) || !correctRadio){ valid = false; return; }
    const answer = Array.from(block.querySelectorAll('.q-correct')).indexOf(correctRadio);
    questions.push({ q:qText, options:opts, answer });
  });

  if(!title || !category || !description || !questions.length || !valid){
    showToast('Please fill in all fields and mark a correct answer for every question.');
    return;
  }

  const editId = document.getElementById('editQuizId').value || null;
  const saveBtn = document.getElementById('saveQuizBtn');
  saveBtn.disabled = true; saveBtn.textContent = 'Saving...';

  try{
    await DB.saveQuiz({ id: editId, title, category, difficulty, thumbnail, description, timePerQuestion, questions });
    showToast(editId ? 'Quiz updated successfully!' : 'Quiz created successfully!');
    closeEditor();
    await renderQuizList();
  }catch(err){
    console.error('Save quiz failed:', err);
    showToast('Failed to save quiz. Check console for details.');
  }finally{
    saveBtn.disabled = false; saveBtn.textContent = 'Save Quiz';
  }
}

function editQuiz(id){
  const quiz = (window.__ALL_QUIZZES__ || []).find(q=>q.id===id);
  if(quiz) openEditor(quiz);
}

async function deleteQuiz(id){
  if(!confirm('Delete this quiz permanently? This cannot be undone.')) return;
  try{
    await DB.deleteQuiz(id);
    await renderQuizList();
    showToast('Quiz deleted.');
  }catch(err){
    console.error('Delete quiz failed:', err);
    showToast('Failed to delete quiz.');
  }
}
</script>
</body>
</html>
