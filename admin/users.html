<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Users | Admin | NEW K-DRAMA Quiz</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0a0a0a">
<link rel="icon" href="../images/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>

<div class="admin-body">
  <aside class="admin-sidebar" id="adminSidebar">
    <a href="index.html" class="logo"><img src="../images/logo.png" alt="NEW K-DRAMA"></a>
    <nav class="admin-nav">
      <a href="index.html">📊 Dashboard</a>
      <a href="analytics.html">📈 Analytics</a>
      <a href="quiz-creation.html">📝 Quiz Creation</a>
      <a href="users.html" class="active">👥 Users</a>
      <a href="../index.html">🏠 View Site</a>
      <a href="#" id="adminLogout">🚪 Log Out</a>
    </nav>
  </aside>

  <main class="admin-main">
    <div class="admin-topbar">
      <button class="btn btn-outline btn-sm mobile-admin-toggle" id="sidebarToggle">☰ Menu</button>
      <h1>Users</h1>
      <input type="search" id="userSearch" placeholder="Search by name or email..." style="padding:10px 16px;border:1.5px solid var(--border);border-radius:50px;min-width:220px;background:var(--bg-card);color:var(--text)">
    </div>

    <div class="stat-grid">
      <div class="stat-card"><span>Total Users</span><b id="uTotal">0</b></div>
      <div class="stat-card"><span>Admins</span><b id="uAdmins">0</b></div>
      <div class="stat-card"><span>Active Players</span><b id="uActive">0</b></div>
    </div>

    <div class="admin-card">
      <div class="table-wrap">
        <table>
          <thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Joined</th><th>Quizzes Played</th><th>Actions</th></tr></thead>
          <tbody id="usersBody">
            <tr><td colspan="6" style="text-align:center;color:var(--text-light)">Loading users...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<div class="toast" id="toast"></div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="../js/firebase-config.js"></script>
<script src="../js/utils.js"></script>
<script src="../js/db.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/admin.js"></script>

<script>
let CURRENT_SESSION = null;
let CACHED_USERS = [];
let CACHED_SCORES = [];

document.addEventListener('DOMContentLoaded', async ()=>{
  const session = await requireAdmin();
  if(!session) return;
  CURRENT_SESSION = session;
  initAdminChrome(session);

  await loadUsers();
  document.getElementById('userSearch').addEventListener('input', e=>renderUsers(e.target.value));
});

async function loadUsers(){
  const body = document.getElementById('usersBody');
  try{
    const [users, scores] = await Promise.all([ DB.getUsers(), DB.getAllScores() ]);
    CACHED_USERS = users;
    CACHED_SCORES = scores;
    renderUsers();
  }catch(err){
    console.error('Failed to load users:', err);
    body.innerHTML = `<tr><td colspan="6" style="text-align:center;color:var(--danger)">Failed to load users.</td></tr>`;
  }
}

function renderUsers(filter=''){
  const term = filter.trim().toLowerCase();

  document.getElementById('uTotal').textContent = CACHED_USERS.length;
  document.getElementById('uAdmins').textContent = CACHED_USERS.filter(u=>u.isAdmin).length;
  document.getElementById('uActive').textContent = new Set(CACHED_SCORES.map(s=>s.userId)).size;

  const filtered = CACHED_USERS.filter(u=>
    (u.name||'').toLowerCase().includes(term) || (u.email||'').toLowerCase().includes(term));

  const body = document.getElementById('usersBody');
  body.innerHTML = filtered.length ? filtered.map(u=>{
    const played = CACHED_SCORES.filter(s=>s.userId===u.id).length;
    return `<tr>
      <td>${escapeHtml(u.name || '—')}</td>
      <td>${escapeHtml(u.email || '—')}</td>
      <td><span class="badge ${u.isAdmin?'badge-admin':'badge-user'}">${u.isAdmin?'Admin':'User'}</span></td>
      <td>${u.joined ? new Date(u.joined).toLocaleDateString() : '—'}</td>
      <td>${played}</td>
      <td>
        <button class="btn btn-outline btn-sm" onclick="toggleAdmin('${u.id}')">${u.isAdmin?'Remove Admin':'Make Admin'}</button>
        <button class="btn btn-danger btn-sm" onclick="deleteUser('${u.id}')">Delete</button>
      </td>
    </tr>`;
  }).join('') : `<tr><td colspan="6" style="text-align:center;color:var(--text-light)">No users found</td></tr>`;
}

async function toggleAdmin(id){
  const u = CACHED_USERS.find(x=>x.id===id);
  if(!u) return;
  try{
    await DB.updateUser(id, { isAdmin: !u.isAdmin });
    u.isAdmin = !u.isAdmin;
    renderUsers(document.getElementById('userSearch').value);
    showToast(`${u.name || 'User'} is ${u.isAdmin?'now an admin':'no longer an admin'}.`);
  }catch(err){
    console.error('Toggle admin failed:', err);
    showToast('Failed to update user. Check console for details.');
  }
}

async function deleteUser(id){
  if(id === CURRENT_SESSION.userId){ showToast("You can't delete your own account while logged in."); return; }
  if(!confirm('Delete this user\'s profile permanently? (Note: this removes their Firestore profile, not their Firebase Auth login — see note below.)')) return;
  try{
    await DB.deleteUserProfile(id);
    CACHED_USERS = CACHED_USERS.filter(u=>u.id!==id);
    renderUsers(document.getElementById('userSearch').value);
    showToast('User profile deleted.');
  }catch(err){
    console.error('Delete user failed:', err);
    showToast('Failed to delete user.');
  }
}
</script>
</body>
</html>
