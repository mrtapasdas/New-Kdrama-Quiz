<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log In or Sign Up | NEW K-DRAMA Quiz</title>
<meta name="description" content="Log in or create a free account to play K-drama quizzes and join the leaderboard.">
<link rel="canonical" href="https://quiz.newkdrama.com/login.html">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0a0a0a">
<link rel="icon" href="images/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-XXXXXXXXXXXXXXXX" crossorigin="anonymous"></script>

<script src="js/db.js"></script>
<script>
  /* Redirect guard: if already logged in, skip this page entirely */
  (function(){
    try{
      const s = DB.session();
      if(s && s.userId){
        const params = new URLSearchParams(location.search);
        const redirect = params.get('redirect');
        location.replace(redirect ? decodeURIComponent(redirect) : 'index.html');
      }
    }catch(e){ console.error('Session check failed:', e); }
  })();
</script>
</head>
<body>

<div id="site-header"></div>

<main class="auth-wrap">
  <div class="auth-grid">
    <div class="auth-card">
      <div class="auth-tabs">
        <button class="auth-tab active" data-tab="login">Log In</button>
        <button class="auth-tab" data-tab="signup">Sign Up</button>
      </div>

      <div class="form-error" id="formError"></div>
      <div class="form-success" id="formSuccess"></div>

      <form class="auth-form active" id="loginForm">
        <div class="form-group"><label for="loginEmail">Email</label><input type="email" id="loginEmail" required></div>
        <div class="form-group"><label for="loginPassword">Password</label><input type="password" id="loginPassword" required minlength="6"></div>
        <button class="btn btn-primary btn-block" type="submit">Log In</button>
      </form>

      <form class="auth-form" id="signupForm">
        <div class="form-group"><label for="signupName">Full Name</label><input type="text" id="signupName" required></div>
        <div class="form-group"><label for="signupEmail">Email</label><input type="email" id="signupEmail" required></div>
        <div class="form-group"><label for="signupPassword">Password</label><input type="password" id="signupPassword" required minlength="6"></div>
        <div class="form-group"><label for="signupConfirm">Confirm Password</label><input type="password" id="signupConfirm" required minlength="6"></div>
        <button class="btn btn-primary btn-block" type="submit">Create Account</button>
      </form>

      <p class="auth-note">By continuing you agree to play fair and have fun 🎬</p>
      <div class="demo-box">Demo admin login: <b>admin@newkdrama.com</b> / <b>admin123</b></div>
    </div>

    <div class="ad-slot" style="margin:0">
      <span class="ad-label">Advertisement</span>
      <ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-XXXXXXXXXXXXXXXX" data-ad-slot="3333333333" data-ad-format="auto" data-full-width-responsive="true"></ins>
      <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
    </div>
  </div>
</main>

<div id="site-footer"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/db.js"></script>
<script src="js/auth.js"></script>
<script src="js/layout.js"></script>
<script>
document.addEventListener('DOMContentLoaded', ()=>{
  try{ renderLayout(''); }catch(err){ console.error('Layout render failed:', err); }

  const params = new URLSearchParams(location.search);
  const redirect = params.get('redirect');
  if(params.get('mode')==='signup') switchTab('signup');

  document.querySelectorAll('.auth-tab').forEach(t=>t.addEventListener('click', ()=>switchTab(t.dataset.tab)));
  function switchTab(tab){
    document.querySelectorAll('.auth-tab').forEach(t=>t.classList.toggle('active', t.dataset.tab===tab));
    document.querySelectorAll('.auth-form').forEach(f=>f.classList.remove('active'));
    document.getElementById(tab+'Form').classList.add('active');
    hideMessages();
  }
  function hideMessages(){
    document.getElementById('formError').style.display='none';
    document.getElementById('formSuccess').style.display='none';
  }
  function showError(msg){ const el=document.getElementById('formError'); el.textContent=msg; el.style.display='block'; }
  function showSuccess(msg){ const el=document.getElementById('formSuccess'); el.textContent=msg; el.style.display='block'; }

  function afterAuthRedirect(){
    window.location.href = redirect ? decodeURIComponent(redirect) : 'index.html';
  }

  document.getElementById('loginForm').addEventListener('submit', async (e)=>{
    e.preventDefault(); hideMessages();
    try{
      await loginUser({ email:document.getElementById('loginEmail').value, password:document.getElementById('loginPassword').value });
      showSuccess('Logged in! Redirecting...');
      setTimeout(afterAuthRedirect, 500);
    }catch(err){ showError(err.message); }
  });

  document.getElementById('signupForm').addEventListener('submit', async (e)=>{
    e.preventDefault(); hideMessages();
    const pw = document.getElementById('signupPassword').value;
    const cpw = document.getElementById('signupConfirm').value;
    if(pw !== cpw){ showError('Passwords do not match.'); return; }
    try{
      await signupUser({ name:document.getElementById('signupName').value, email:document.getElementById('signupEmail').value, password:pw });
      showSuccess('Account created! Redirecting...');
      setTimeout(afterAuthRedirect, 500);
    }catch(err){ showError(err.message); }
  });
});
</script>
</body>
</html>
